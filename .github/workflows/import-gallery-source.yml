name: Publish reviewed responsive device gallery
on:
  push:
    paths: ['.github/workflows/import-gallery-source.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify and write the two reviewed public files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request, json, base64, hashlib, os
          files = {
            'README.md': ('1b57ad670a85db9e8283fc5b598d1077284f2c9a', 'db1b344255591e66ded4b9e3d5fe2431b08a5b6e40727f0194bcdbf915c5e20e'),
            'SOURCE-SHA256.json': ('e8fdabeb3ddda4be520f5a3ffa172ffbdac6e817', '42b324a1ac4cf1473d2059d7007b176b65dd7a931efbc376439df72508c1515d')
          }
          for name, (blob, digest) in files.items():
            request = urllib.request.Request('https://api.github.com/repos/LucasLG92/omarchy-apollo/git/blobs/' + blob, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
            with urllib.request.urlopen(request, timeout=20) as response:
              result = json.load(response)
            data = base64.b64decode(result['content'])
            assert hashlib.sha256(data).hexdigest() == digest
            Path(name).write_bytes(data)
          manifest = json.loads(Path('SOURCE-SHA256.json').read_text())
          for name, digest in manifest.items():
            assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          Path('.github/workflows/import-gallery-source.yml').unlink()
          print('Verified public files:', len(manifest) + 1)
          PY
      - name: Commit with the public automation identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md SOURCE-SHA256.json .github/workflows/import-gallery-source.yml
          git commit -m 'Keep the device gallery readable on narrow screens'
          git push
