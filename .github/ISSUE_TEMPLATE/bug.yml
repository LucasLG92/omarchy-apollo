name: Bug report
description: Report a reproducible problem with a clear code track and test scope.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Read the hardware status first. The 4.5 RC2 work is RAM-only; older installation results are historical.
        Share a short sanitized summary, not raw bugreports, firmware, calibration or partition images.
  - type: dropdown
    id: track
    attributes:
      label: Code track
      options:
        - 4.5 RC2 rebase / current RAM work
        - Historical 2026-10-30 integration
        - Other / explain below
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Model and component versions
      description: Model/codename, source commit, package versions, native Linux or Android container. No serial, radio identifiers, network names or private paths.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction and result
      description: Expected behavior, exact observed behavior, smallest safe reproduction, and whether this was hardware or a fixture.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence and recovery
      description: Relevant result codes/counts and recovery outcome. Review screenshots for contacts, messages, locations and notifications. Do not paste raw logs or secrets.
  - type: checkboxes
    id: privacy
    attributes:
      label: Publication review
      options:
        - label: I removed credentials, keys, PIN/verifier data, identifiers, addresses, network names, location and personal content.
          required: true
