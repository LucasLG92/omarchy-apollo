name: Focused improvement
description: Propose a useful, testable step toward a complete native phone.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What is difficult or missing on the current track? Link the relevant hardware-status item.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change and acceptance
      description: Keep the scope small. Explain how a device owner can tell it works, and what recovery or accessories are needed.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Sources or related work
      description: Prefer upstream code/documentation and preserve attribution. No private diagnostics or device dumps.
