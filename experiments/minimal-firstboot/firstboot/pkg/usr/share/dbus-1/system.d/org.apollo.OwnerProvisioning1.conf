<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny own="org.apollo.OwnerProvisioning1"/>
    <deny send_destination="org.apollo.OwnerProvisioning1"/>
  </policy>
  <policy user="root">
    <allow own="org.apollo.OwnerProvisioning1"/>
  </policy>
  <policy user="sddm">
    <allow send_destination="org.apollo.OwnerProvisioning1" send_interface="org.apollo.OwnerProvisioning1" send_member="GetState"/>
    <allow send_destination="org.apollo.OwnerProvisioning1" send_interface="org.apollo.OwnerProvisioning1" send_member="Configure"/>
    <allow send_destination="org.apollo.OwnerProvisioning1" send_interface="org.freedesktop.DBus.Introspectable" send_member="Introspect"/>
  </policy>
</busconfig>
