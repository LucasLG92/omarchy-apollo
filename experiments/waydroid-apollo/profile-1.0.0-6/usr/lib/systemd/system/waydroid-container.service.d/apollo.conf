# Apollo: start only on request; no boot enablement or network-online wait.
[Service]
ExecStartPre=/usr/lib/omamobile-waydroid/omamobile-waydroid-check --running
ExecStartPre=/usr/lib/omamobile-waydroid/omamobile-waydroid-harden config /
ExecStartPre=/usr/lib/omamobile-waydroid/omamobile-waydroid-harden verify /

[Unit]
Wants=apollo-waydroid-orientation.service
