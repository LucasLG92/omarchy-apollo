# Keep all four sensors available, with distinct names in camera applications.
# Match Apollo's exact hardware paths; do not rename unrelated cameras.
monitor.libcamera.rules = [
  {
    matches = [
      {
        node.name = "libcamera_input._base_soc_0_cci_ac4f000_i2c-bus_0_camera_3d"
      }
    ]
    actions = {
      update-props = {
        node.description = "Apollo Main Rear Camera"
        node.nick = "Main rear camera"
        priority.session = 900
      }
    }
  }
  {
    matches = [
      {
        node.name = "libcamera_input._base_soc_0_cci_ac50000_i2c-bus_1_camera_10"
      }
    ]
    actions = {
      update-props = {
        node.description = "Apollo Front Camera"
        node.nick = "Front camera"
        priority.session = 800
      }
    }
  }
  {
    matches = [
      {
        node.name = "libcamera_input._base_soc_0_cci_ac50000_i2c-bus_0_camera_36"
      }
    ]
    actions = {
      update-props = {
        node.description = "Apollo Ultrawide Camera"
        node.nick = "Ultrawide camera"
        priority.session = 700
      }
    }
  }
  {
    matches = [
      {
        node.name = "libcamera_input._base_soc_0_cci_ac4f000_i2c-bus_1_camera_2d"
      }
    ]
    actions = {
      update-props = {
        node.description = "Apollo Macro Camera"
        node.nick = "Macro camera"
        priority.session = 650
      }
    }
  }
]
