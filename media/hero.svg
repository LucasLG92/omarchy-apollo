<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Omarchy Apollo — native Linux, made for a phone</title>
  <desc id="desc">Original project illustration with a phone, orbit lines and the current experimental Omarchy 4.5 RC2 milestone. Not a device screenshot.</desc>
