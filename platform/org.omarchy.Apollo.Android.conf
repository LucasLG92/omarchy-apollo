<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.omarchy.Apollo.Android"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.omarchy.Apollo.Android" send_interface="org.omarchy.Apollo.Android1" send_member="InstallApk"/>
    <allow send_destination="org.omarchy.Apollo.Android" send_interface="org.omarchy.Apollo.Android1" send_member="Release"/>
    <allow send_destination="org.omarchy.Apollo.Android" send_interface="org.freedesktop.DBus.Introspectable" send_member="Introspect"/>
    <allow receive_sender="org.omarchy.Apollo.Android"/>
  </policy>
</busconfig>
