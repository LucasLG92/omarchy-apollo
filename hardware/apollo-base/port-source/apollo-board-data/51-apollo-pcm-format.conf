# Q6ASM on this Apollo firmware does not provide ALSA S24_LE with the expected
# LSB alignment. The 24-bit capture path corrupts the signal.
# Keep the userspace front ends at the verified 16-bit format; the DSP still
# converts to the codec backend format selected by the machine driver.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.platform-sound.*" }
      { node.name = "~alsa_output.platform-sound.*" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
      }
    }
  }
]
